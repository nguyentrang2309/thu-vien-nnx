<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư viện Bảo hiểm Ngôi Nhà Xanh</title>
<link rel="preload" href="fonts/svn-gilroy-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/svn-gilroy-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Font SVN-Gilroy (file trong thư mục fonts/) */
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-800.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
/* Layout: sidebar danh mục cố định bên trái + băng tin chạy + lưới thẻ sản phẩm; bấm thẻ mở ngăn tài liệu bên phải */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --ink:#12231A; --muted:#5A6B60; --line:#D9E3DA;
  --brand:#0A8A3E; --brand-deep:#075C2A; --brand-soft:#E2F1E6; --lime:#D4EC3A; --on-brand:#FFFFFF;
  --t-health:#E3F3E8; --t-acc:#FFF3D6; --t-income:#E6EEFB; --t-bike:#F2E9FB; --t-car:#E0F2F4;
  --i-health:#0A8A3E; --i-acc:#B26A00; --i-income:#2D5BB8; --i-bike:#7A43B6; --i-car:#0B7C86;
  --shadow:0 1px 2px rgba(18,35,26,.06),0 6px 20px rgba(18,35,26,.06);
  --f-display:"SVN-Gilroy",system-ui,"Segoe UI",Arial,sans-serif;
  --f-body:"SVN-Gilroy",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"SVN-Gilroy",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#141E18; --ink:#E5EEE7; --muted:#92A497; --line:#25332A;
  --brand:#2DBE66; --brand-deep:#1F8E4C; --brand-soft:#16301F; --lime:#C6E03A; --on-brand:#06170C;
  --t-health:#15301F; --t-acc:#33280F; --t-income:#172340; --t-bike:#271A38; --t-car:#102E31;
  --i-health:#4CD383; --i-acc:#F0B54A; --i-income:#7FA6F2; --i-bike:#B992EA; --i-car:#4CC6CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#141E18; --ink:#E5EEE7; --muted:#92A497; --line:#25332A;
  --brand:#2DBE66; --brand-deep:#1F8E4C; --brand-soft:#16301F; --lime:#C6E03A; --on-brand:#06170C;
  --t-health:#15301F; --t-acc:#33280F; --t-income:#172340; --t-bike:#271A38; --t-car:#102E31;
  --i-health:#4CD383; --i-acc:#F0B54A; --i-income:#7FA6F2; --i-bike:#B992EA; --i-car:#4CC6CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.04em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 14px 16px 16px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.logo svg{width:24px;height:24px;stroke-width:2.2}
.logo-img{display:block;flex:none;height:42px;width:auto;background:#fff;padding:5px 7px;border-radius:8px;border:1px solid var(--line)}
.brand b{display:block;font-family:var(--f-mono);font-size:14px;letter-spacing:.05em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted)}
.search{padding:16px 16px 8px}
.search label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--ink)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav h4{margin:16px 10px 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:7px;text-align:left;font-family:var(--f-mono);font-size:13.5px;color:var(--ink)}
.nav button:hover{background:var(--brand-soft)}
.nav button .n{margin-left:auto;font-size:12px;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--brand);color:var(--on-brand);font-weight:700}
.nav button[aria-current="true"] .n{color:inherit;opacity:.8}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:7px;background:var(--brand-deep);color:#fff;padding:11px;font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.06em}
.cta:hover{background:var(--brand)}
.side-foot p{margin:0;font-size:12px;color:var(--muted);text-align:center}

/* Main */
main{min-width:0;display:flex;flex-direction:column}
.ticker{background:var(--brand-deep);color:#fff;overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;padding-block:9px}
.ticker .track{display:inline-flex;gap:28px;padding-left:28px;animation:tick 48s linear infinite}
.ticker span b{color:var(--lime)}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-block:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.top .ttl{min-width:0}
.top h1{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;text-wrap:balance}
.top .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.acts{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.honor{display:inline-flex;align-items:center;gap:8px;height:40px;border:1px solid var(--brand-deep);border-radius:8px;background:var(--lime);color:#1B2A06;padding:0 14px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.1em}
.honor:hover{filter:brightness(1.05);box-shadow:var(--shadow)}
.honor[aria-current="true"]{background:var(--brand-deep);color:var(--lime)}
.pill{border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 12px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.menu-btn{display:none}
.side-x{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}
.side-x:hover{color:var(--brand);border-color:var(--brand)}
/* Máy tính: thu gọn menu trái để nội dung chiếm hết chiều ngang */
@media (min-width:901px){
  .app.collapsed{grid-template-columns:minmax(0,1fr)}
  .app.collapsed .side{display:none}
  .app.collapsed .menu-btn{display:grid}
}

.content{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:28px}

/* Need picker */
.needs{display:grid;gap:12px}
.needs h2{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.needs h2 b{color:var(--ink)}
.need-row{display:flex;gap:10px;flex-wrap:wrap}
.need{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px 10px 10px;font-weight:600;font-size:14px}
.need .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.need:hover{border-color:var(--brand)}
.need[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:var(--brand-soft)}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand)}
.cover{position:relative;aspect-ratio:16/8;max-width:100%;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;max-width:82%}
.tags .tag.ins{background:var(--ink);color:var(--surface)}
.d-cover .tag{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.1em;border-radius:4px;padding:4px 8px}
.ins-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ins-row .mono{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin-right:4px}
.ins-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.04em}
.ins-chip:hover{border-color:var(--ink)}
.ins-chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cover .tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.12em;background:var(--surface);border-radius:4px;padding:3px 7px}
.cover .big{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px;opacity:.9;stroke-width:1.1}
.cover .name{position:relative;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;max-width:70%;text-wrap:balance}
.cover .ins{position:relative;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.85}
.card-body{padding:14px 18px 16px;display:grid;gap:10px;flex:1;align-content:start}
.card-head{display:flex;align-items:center;gap:10px}
.card-head h3{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:-2px;font-size:13px;color:var(--muted)}
.by svg{width:16px;height:16px;color:var(--brand)}
.by span{margin-right:2px}
.by b{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--surface);background:var(--ink);border-radius:4px;padding:2px 8px}
.open{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--muted)}
.chip.ok{border-color:var(--brand);color:var(--brand);font-weight:700}

.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* Media sections */
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.sec-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.sec-h a{margin-left:auto;font-size:13px;color:var(--brand);font-weight:600;text-decoration:none}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.m{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;text-decoration:none}
.m:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.m.nolink:hover{border-color:var(--line);box-shadow:none}
.m .ic{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.m .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.m h3{margin:2px 0 4px;font-size:15.5px;font-weight:700;line-height:1.35}
.m p{margin:0;font-size:13.5px;color:var(--muted)}
.m .go{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--brand);font-weight:600}
.m .go svg{width:14px;height:14px}
.m .when{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.m .when svg{width:14px;height:14px}
.sec-h.year{border-bottom:2px solid var(--brand);padding-bottom:8px}
.sec-h.year h2{color:var(--brand)}
.m.star .ic{background:var(--lime);color:#1d2a06}
/* Thẻ vinh danh */
.media:has(> .hc){grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.hc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;min-width:0;transition:transform .15s,box-shadow .15s}
.hc:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand)}
.hc-top{position:relative;overflow:hidden;background:#075C2A;color:#fff;padding:16px 18px 18px;display:grid;gap:10px}
.hc-deco{position:absolute;right:-18px;bottom:-26px;width:120px;height:120px;stroke-width:1.1;color:rgba(212,236,58,.22)}
.hc-row{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hc-date{flex:none}
.hc-badge{display:inline-flex;align-items:center;gap:6px;min-width:0;background:#D4EC3A;color:#1B2A06;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.02em;line-height:1.3;padding:5px 10px;border-radius:6px}
.hc-badge svg,.hc-date svg{width:14px;height:14px;flex:none}
.hc-date{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:4px 8px}
.hc-name{position:relative;margin:4px 0 0;font-family:var(--f-display);font-size:21px;font-weight:800;line-height:1.2;text-wrap:balance}
.hc-info{position:relative;font-size:13.5px;color:rgba(255,255,255,.82)}
.hc-info b{color:#D4EC3A;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em}
.hc-info .dot{margin:0 6px;opacity:.6}
.hc-body{display:grid;gap:12px;padding:14px 18px 16px;align-content:start;flex:1}
.hc-body p{margin:0;font-size:14px;color:var(--muted)}
.hc .go{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);font-weight:600}
.hc .go svg{width:14px;height:14px}
.hc{cursor:pointer}

/* Popup vinh danh */
/* Khung popup luôn vừa màn hình; phần đầu xanh đứng yên, phần nội dung bên dưới cuộn riêng */
.hm{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.hm-box{position:relative;display:flex;flex-direction:column;width:min(720px,100%);max-height:100%;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:hmIn .18s ease-out}
.hm .hc-top{flex:none}
.hm-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--brand) transparent}
.hm-body::-webkit-scrollbar{width:8px}
.hm-body::-webkit-scrollbar-thumb{background:var(--brand);border-radius:8px}
@media (max-width:600px){.hm{padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px))}.hm .hm-box .hc-top{padding:16px 18px 18px}.hm .hm-box .hm-body{padding:16px 18px 20px}}
@keyframes hmIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.hm-box{animation:none}}
.hm .hc-top{padding:22px 24px 24px;gap:12px}
.hm .hc-deco{width:180px;height:180px;right:-24px;bottom:-40px}
.hm .hc-name{font-size:clamp(24px,4vw,30px)}
.hm-x{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.18);color:#fff}
.hm-x:hover{background:rgba(0,0,0,.35)}
.hm .hc-row{padding-right:44px}
.hm-body{padding:20px 24px 24px;display:grid;gap:14px}
.hm-body h4{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.35;text-wrap:balance}
.hm-lead{margin:0;font-size:15px;color:var(--ink);opacity:.85}
.hm-text{display:grid;gap:10px;font-size:15px;line-height:1.65;border-top:1px solid var(--line);padding-top:14px}
.hm-text p{margin:0}
.hm-frame{width:100%;aspect-ratio:4/3;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hm-acts{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.hm-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand);border-radius:8px;background:var(--brand);color:var(--on-brand);padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none}
.hm-btn.ghost{background:transparent;color:var(--brand)}
.hm-btn svg{width:15px;height:15px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,18,12,.45);z-index:40}
.drawer{position:fixed;inset:0;background:var(--bg);z-index:41;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.d-cover,.d-body{padding-left:max(24px,env(safe-area-inset-left,0px),calc((100% - 1160px)/2));padding-right:max(24px,env(safe-area-inset-right,0px),calc((100% - 1160px)/2))}
.d-cover{position:relative;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:32px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden;border-bottom:1px solid var(--line)}
.d-cover .big{position:absolute;right:max(24px,calc((100% - 1160px)/2));bottom:-40px;width:260px;height:260px;stroke-width:.9;opacity:.9}
.d-cover h2{position:relative;margin:0;font-family:var(--f-display);font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.1;max-width:70%;text-wrap:balance}
.d-cover .ins{position:relative;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
.d-cover .lead{position:relative;margin:6px 0 0;max-width:60ch;color:var(--ink);opacity:.8;font-size:15.5px}
.d-close{position:relative;z-index:2;align-self:flex-start;margin-bottom:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 14px 8px 10px;font-weight:600;font-size:14px}
.d-close svg{transform:rotate(180deg)}
.d-close:hover{border-color:var(--brand);color:var(--brand)}
.d-body{padding-top:28px;padding-bottom:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-content:start}
.d-sec.wide{grid-column:1/-1}
.d-sec h3{margin:0 0 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.docs .doc{background:var(--surface);padding:14px 12px 14px 14px}
.d-body .row{background:var(--surface)}
@media (max-width:900px){.d-body{grid-template-columns:minmax(0,1fr)}.d-cover{min-height:220px}.d-cover .big{width:170px;height:170px;bottom:-24px;right:-20px}.d-cover h2{max-width:80%}}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 12px;min-width:0;background:var(--bg)}
.doc:hover{border-color:var(--brand)}
.doc a{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none}
.doc .di{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.doc b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.doc small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.doc .cp{border:0;background:transparent;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none}
.doc .cp:hover{background:var(--brand-soft);color:var(--brand)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-size:14px}
.row:hover{border-color:var(--brand)}
.row span{flex:1;min-width:0}
.row svg:last-child{color:var(--muted);width:15px;height:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60}

/* Mobile */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:50;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .side.open{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.2)}
  .menu-btn{display:grid}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .acts{margin-left:0;width:100%}
  .acts .iconbtn{margin-left:auto}
  .top .ttl{flex:1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .docs{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side" aria-label="Danh mục">
    <div class="brand">
      <img class="logo-img" src="logo-nnx.webp" alt="NNX Insurance" width="2000" height="1111">
      <div style="min-width:0;flex:1"><b>NGÔI NHÀ XANH</b><small>Thư viện bán bảo hiểm</small></div>
      <button class="side-x" id="sideClose" title="Thu gọn menu" aria-label="Thu gọn menu"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/><path d="M20 5v14"/></svg></button>
    </div>
    <div class="search">
      <label for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm sản phẩm, tài liệu…" autocomplete="off"></label>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="cta" id="bonus"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M7.5 8a2.5 2.5 0 1 1 4.5-1.5V8M16.5 8A2.5 2.5 0 1 0 12 6.5"/></svg>CHÍNH SÁCH THƯỞNG 2026</button>
      <p>Tài liệu mở trên Google Drive, cần đăng nhập tài khoản công ty</p>
    </div>
  </aside>

  <main>
    <div class="ticker" aria-hidden="true"><div class="track" id="ticker"></div></div>
    <header class="top">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Mở danh mục"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="ttl"><h1 id="title">Tất cả sản phẩm</h1><div class="count" id="count"></div></div>
      <div class="acts">
        <div class="pills" id="pills" role="group" aria-label="Lọc theo kênh"></div>
        <button class="honor" id="honorBtn" data-view="sec-case" aria-current="false"><svg class="i" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0Z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v3.5M8.5 20h7l-1-3.5h-5Z"/></svg>VINH DANH</button>
        <button class="iconbtn" id="themeBtn" aria-label="Đổi giao diện sáng/tối"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="hm" id="honorModal" hidden role="dialog" aria-modal="true" aria-labelledby="hmTitle"></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="sheet.js"></script>
<script src="thongke.js"></script>
<script>
/* ============ ICONS ============ */
const P = {
  heart:'<path d="M19.5 12.6 12 20l-7.5-7.4A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 7.5 6.3Z"/><path d="M3.5 12h4l1.5-2.5 2.5 5 1.5-2.5h7.5"/>',
  shield:'<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/>',
  wallet:'<path d="M4 7.5h14.5a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 18.5V6a1.5 1.5 0 0 1 1.5-1.5H17"/><circle cx="16" cy="13.8" r="1.2"/>',
  bike:'<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h5l4.5 7.5M14 9l-1.5-3H10M9 9l3.5 7.5"/>',
  car:'<path d="M5 16.5V12l2-5h10l2 5v4.5"/><path d="M3.5 16.5h17M5 12h14"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/>',
  image:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="m20 15-4.5-4.5L6 20"/>',
  scale:'<path d="M12 4v16M7 20h10M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0Zm14 0-2.5 6a3 3 0 0 0 5 0Z"/>',
  briefcase:'<rect x="3.5" y="7.5" width="17" height="12" rx="1.5"/><path d="M9 7.5V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5v2M3.5 13h17"/>',
  book:'<path d="M4.5 5.5A1.5 1.5 0 0 1 6 4h13.5v14H6a1.5 1.5 0 0 0-1.5 1.5Zm0 14A1.5 1.5 0 0 0 6 21h13.5v-3"/><path d="M9 8h6"/>',
  pen:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/>',
  lifebuoy:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="m6 6 3.5 3.5M14.5 14.5 18 18M18 6l-3.5 3.5M9.5 14.5 6 18"/>',
  calc:'<rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8 7.5h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>',
  camera:'<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2.5h6L16.5 7h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"/><circle cx="12" cy="13" r="3.2"/>',
  folder:'<path d="M3.5 7A1.5 1.5 0 0 1 5 5.5h4.5l2 2.5H19A1.5 1.5 0 0 1 20.5 9.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5Z"/>',
  news:'<path d="M5 5h11.5v14H6.5A1.5 1.5 0 0 1 5 17.5Z"/><path d="M16.5 9H19v8.5a1.5 1.5 0 0 1-3 0M8 8.5h5.5M8 12h5.5M8 15.5h3.5"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0Z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v3.5M8.5 20h7l-1-3.5h-5Z"/>',
  megaphone:'<path d="M4 10v4a1 1 0 0 0 1 1h2.5l7.5 4V5L7.5 9H5a1 1 0 0 0-1 1Z"/><path d="M18 9a4 4 0 0 1 0 6M7.5 15l1 4.5"/>',
  gift:'<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20M12 8.5A2.5 2.5 0 1 1 9.5 6c1.5 0 2.5 2.5 2.5 2.5Zm0 0A2.5 2.5 0 1 0 14.5 6C13 6 12 8.5 12 8.5Z"/>',
  ext:'<path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>',
  copy:'<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="1.5"/><path d="M15.5 8.5V5.5A1.5 1.5 0 0 0 14 4H5.5A1.5 1.5 0 0 0 4 5.5V14a1.5 1.5 0 0 0 1.5 1.5h3"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  calendar:'<rect x="4" y="5.5" width="16" height="14.5" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  layers:'<path d="m12 4 8.5 4.5L12 13 3.5 8.5Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/>',
};
const ic = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||""}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => u.includes("thuvien.f88") ? "THƯ VIỆN F88" : u.includes("gapowork") ? "GAPOWORK" : u.includes("spreadsheets") ? "GOOGLE SHEETS" : u.includes("docs.google.com/document") ? "GOOGLE DOCS" : u.includes("presentation") ? "GOOGLE SLIDES" : u.includes("/folders/") ? "THƯ MỤC DRIVE" : u.includes("sites.google") ? "GOOGLE SITES" : "GOOGLE DRIVE";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");

/* ============ STATE ============ */
const S = {view:"products", need:"all", ch:"all", ins:"all", q:""};
const $ = id => document.getElementById(id);
const needOf = id => NEEDS.find(n => n.id === id);
const docLabel = d => d[2] || DOC_TYPES[d[0]].label;

function prodText(p){ return norm([p.name,p.ins,p.desc,...(p.insurers||[]),needOf(p.need).short,CHANNELS[p.ch],...p.docs.map(docLabel)].join(" ")); }
function filteredProducts(){
  const q = norm(S.q.trim());
  return PRODUCTS.filter(p => (S.need==="all"||p.need===S.need) && (S.ch==="all"||p.ch===S.ch) && (S.ins==="all"||(p.insurers||[]).includes(S.ins)) && (!q || prodText(p).includes(q)));
}

/* ============ RENDER ============ */
function renderNav(){
  const counts = n => PRODUCTS.filter(p => (n==="all"||p.need===n) && (S.ch==="all"||p.ch===S.ch)).length;
  const cur = (v,n) => S.view===v && (v!=="products" || S.need===n);
  let h = `<h4>SẢN PHẨM THEO NHU CẦU</h4>`;
  h += `<button data-view="products" data-need="all" aria-current="${cur("products","all")}">${ic("layers")}Tất cả sản phẩm<span class="n">${counts("all")}</span></button>`;
  NEEDS.forEach(n => h += `<button data-view="products" data-need="${n.id}" aria-current="${cur("products",n.id)}">${ic(n.icon)}${n.short}<span class="n">${counts(n.id)}</span></button>`);
  h += `<h4>TRUYỀN THÔNG & HỖ TRỢ BÁN</h4>`;
  h += `<button data-view="media" aria-current="${S.view==="media"}">${ic("grid")}Tổng quan truyền thông<span class="n">${MEDIA.length}</span></button>`;
  SECTIONS.forEach(s => h += `<button data-view="sec-${s.id}" aria-current="${S.view==="sec-"+s.id}">${ic(s.icon)}${s.label}<span class="n">${MEDIA.filter(m=>m.sec===s.id).length}</span></button>`);
  $("nav").innerHTML = h;
}
function renderPills(){
  const opts = [["all","TẤT CẢ"],["kdml","KDML"],["ns","NGÔI SAO BH"]];
  $("pills").innerHTML = opts.map(([v,l]) => `<button class="pill" data-ch="${v}" aria-pressed="${S.ch===v}">${l}</button>`).join("");
  $("pills").hidden = S.view !== "products";
  $("honorBtn").setAttribute("aria-current", S.view === "sec-case");
}
const insTags = p => (p.insurers||[]).map(x => `<span class="tag ins">${esc(x)}</span>`).join("");
let ALL_INS = [];
function card(p){
  const n = needOf(p.need);
  const types = [...new Set(p.docs.map(d=>d[0]))];
  return `<button class="card" data-open="${p.id}">
    <div class="cover" style="background:var(--t-${p.need});color:var(--i-${p.need})">
      <div class="tags"><span class="tag">${CHANNELS[p.ch]}</span>${insTags(p)}</div>
      ${ic(n.icon,"i big")}
      <div><div class="name" style="color:var(--ink)">${esc(n.short)}</div><div class="ins">${esc(p.ins)}</div></div>
    </div>
    <div class="card-body">
      <div class="card-head"><h3>${esc(p.name)}</h3><span class="open">${ic("arrow")}</span></div>      <p>${esc(p.desc)}</p>
      <div class="chips"><span class="chip ok">${p.docs.length} TÀI LIỆU</span>${types.slice(0,3).map(t=>`<span class="chip">${DOC_TYPES[t].label}</span>`).join("")}</div>
    </div></button>`;
}
/* Thẻ vinh danh: phần đầu xanh (thành tích, thời gian, họ tên, chức danh · PGD), phần dưới là mô tả */
function honorTop(m, nameTag="h3", nameId=""){
  return `<div class="hc-top">
      ${ic(m.sec==="bonus"?"gift":"trophy","i hc-deco")}
      <div class="hc-row">${m.badge ? `<span class="hc-badge">${ic(m.sec==="bonus"?"gift":"trophy")}${esc(m.badge)}</span>` : "<span></span>"}${m.date ? `<span class="hc-date">${ic("calendar")}${esc(m.date)}</span>` : ""}</div>
      <${nameTag} class="hc-name"${nameId ? ` id="${nameId}"` : ""}>${esc(m.name)}</${nameTag}>
      ${m.role || m.pgd ? `<div class="hc-info">${m.role ? `<b>${esc(m.role)}</b>` : ""}${m.role && m.pgd ? `<span class="dot">·</span>` : ""}${esc(m.pgd||"")}</div>` : ""}
    </div>`;
}
/* Bấm thẻ mở popup; Ctrl/chuột giữa vẫn mở link ở tab mới */
function honorCard(m){
  /* Không có link bài gốc thì href là link vinh danh trong thư viện (Ctrl + bấm vẫn mở được tab mới) */
  return `<a class="hc" href="${m.u ? m.u : "#"+honorSlug(m)}"${m.u ? ` target="_blank" rel="noopener"` : ""} data-honor="${esc(m.id)}">
    ${honorTop(m)}
    <div class="hc-body">
      ${m.d ? `<p>${esc(m.d)}</p>` : ""}
      <span class="go">Xem chi tiết ${ic("arrow")}</span>
    </div></a>`;
}
function mItem(m){
  if ((m.sec === "case" || m.sec === "bonus") && m.name) return honorCard(m);
  if (!m.u) return `<div class="m nolink${m.star?" star":""}">
    <span class="ic">${ic(m.icon)}</span>
    <span><span class="k">${esc(m.k)}</span><h3>${esc(m.t)}</h3>${m.d?`<p>${esc(m.d)}</p>`:""}${m.date?`<span class="when">${ic("calendar")}Cập nhật ${esc(m.date)}</span>`:""}</span></div>`;
  return `<a class="m${m.star?" star":""}" href="${m.u}" target="_blank" rel="noopener">
    <span class="ic">${ic(m.icon)}</span>
    <span><span class="k">${esc(m.k)}</span><h3>${esc(m.t)}</h3>${m.d?`<p>${esc(m.d)}</p>`:""}${m.date?`<span class="when">${ic("calendar")}Cập nhật ${esc(m.date)}</span>`:""}<span class="go">Mở trên ${host(m.u).toLowerCase().replace(/^./,c=>c.toUpperCase())} ${ic("ext")}</span></span></a>`;
}
/* "08/04/2026" | "04/2026" | "2026" -> số để sắp xếp (20260408) */
function dateKey(s){
  if (!s) return 0;
  const p = String(s).split("/").map(Number).reverse();
  return (p[0]||0)*10000 + (p[1]||0)*100 + (p[2]||0);
}
const yearOf = s => s ? String(s).slice(-4) : "";
function groupByYear(items){
  if (!items.some(m => m.date)) return `<div class="media">${items.map(mItem).join("")}</div>`;
  const sorted = [...items].sort((a,b) => dateKey(b.date) - dateKey(a.date));
  const groups = [];
  sorted.forEach(m => {
    const y = yearOf(m.date) || "Khác";
    let g = groups.find(x => x.y === y);
    if (!g) groups.push(g = {y, list:[]});
    g.list.push(m);
  });
  return groups.map(g => `<section class="sec"><div class="sec-h year"><h2>${g.y==="Khác"?"Chưa có ngày":"Năm "+g.y}</h2><span>${g.list.length} MỤC</span></div><div class="media">${g.list.map(mItem).join("")}</div></section>`).join("");
}
function mediaMatches(sec){
  const q = norm(S.q.trim());
  return MEDIA.filter(m => (!sec||m.sec===sec) && (!q || norm([m.t,m.d,m.k,m.name,m.role,m.pgd,m.badge].filter(Boolean).join(" ")).includes(q)));
}
function renderContent(){
  const c = $("content");
  if (S.view === "products"){
    const list = filteredProducts();
    $("title").textContent = S.need==="all" ? "Tất cả sản phẩm" : needOf(S.need).short;
    $("count").textContent = `${list.length} sản phẩm · ${list.reduce((a,p)=>a+p.docs.length,0)} tài liệu`;
    let h = `<section class="needs" aria-label="Chọn nhu cầu"><h2><b>Bước 1:</b> Khách hàng đang cần gì?</h2><div class="need-row">`;
    h += `<button class="need" data-need="all" aria-pressed="${S.need==="all"}"><span class="ic" style="background:var(--brand-soft);color:var(--brand)">${ic("layers")}</span>Xem tất cả</button>`;
    NEEDS.forEach(n => h += `<button class="need" data-need="${n.id}" aria-pressed="${S.need===n.id}"><span class="ic" style="background:var(--t-${n.id});color:var(--i-${n.id})">${ic(n.icon)}</span>${n.label}</button>`);
    if (ALL_INS.length) h += `</div><div class="ins-row"><span class="mono">HÃNG BẢO HIỂM</span><button class="ins-chip" data-ins="all" aria-pressed="${S.ins==="all"}">Tất cả</button>${ALL_INS.map(x=>`<button class="ins-chip" data-ins="${esc(x)}" aria-pressed="${S.ins===x}">${esc(x)}</button>`).join("")}`;
    h += `</div><h2><b>Bước 2:</b> Chọn sản phẩm để mở brochure, quy tắc, hướng dẫn bồi thường, salekit…</h2></section>`;
    h += list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">${S.q.trim() ? `Không có sản phẩm khớp “${esc(S.q)}”. Thử từ khóa khác, ví dụ “quy tắc”, “ô tô”, “MIC”.` : `Chưa có sản phẩm cho lựa chọn này. Chọn “Tất cả” ở nhu cầu, kênh hoặc hãng bảo hiểm để xem thêm.`}</div>`;
    const extra = S.q.trim() ? mediaMatches() : [];
    if (extra.length) h += `<section class="sec"><div class="sec-h"><h2>Truyền thông & kỹ năng khớp từ khóa</h2><span>${extra.length} MỤC</span></div><div class="media">${extra.map(mItem).join("")}</div></section>`;
    c.innerHTML = h;
  } else if (S.view === "media"){
    $("title").textContent = "Truyền thông & hỗ trợ bán";
    $("count").textContent = `${mediaMatches().length} mục`;
    c.innerHTML = SECTIONS.map(s => {
      const items = mediaMatches(s.id); if(!items.length) return "";
      return `<section class="sec"><div class="sec-h"><h2>${s.label}</h2><span>${items.length} MỤC</span><a href="#" data-view="sec-${s.id}">Xem riêng →</a></div><div class="media">${items.map(mItem).join("")}</div></section>`;
    }).join("") || `<div class="empty">Không có mục khớp “${esc(S.q)}”.</div>`;
  } else {
    const s = SECTIONS.find(x => "sec-"+x.id === S.view);
    const items = mediaMatches(s.id);
    $("title").textContent = s.label;
    $("count").textContent = `${items.length} mục`;
    c.innerHTML = items.length ? groupByYear(items) : `<div class="empty">Không có mục khớp “${esc(S.q)}”.</div>`;
  }
}
function render(){ renderNav(); renderPills(); renderContent(); syncHash(); }

/* Ghi trang đang xem lên thanh địa chỉ để tải lại (F5) hoặc gửi link vẫn mở đúng trang:
   #muc=case (mục truyền thông), #muc=tong-quan, #nhucau=health&kenh=kdml&hang=MIC (sản phẩm) */
function viewHash(){
  const p = new URLSearchParams();
  if (S.view === "media") p.set("muc", "tong-quan");
  else if (S.view.startsWith("sec-")) p.set("muc", S.view.slice(4));
  else {
    if (S.need !== "all") p.set("nhucau", S.need);
    if (S.ch !== "all") p.set("kenh", S.ch);
    if (S.ins !== "all") p.set("hang", S.ins);
  }
  return p.toString();
}
/* Khi đang mở sản phẩm (#p-) hoặc vinh danh (#vd-) thì giữ link riêng đó */
function syncHash(){
  if (!$("drawer").hidden || !$("honorModal").hidden) return;
  const h = viewHash();
  try{ history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : "")); }catch(e){}
}
function readHash(h){
  const p = new URLSearchParams(h.replace(/^#/, "")), muc = p.get("muc");
  if (muc === "tong-quan") S.view = "media";
  else if (muc && SECTIONS.some(s => s.id === muc)) S.view = "sec-" + muc;
  if (NEEDS.some(n => n.id === p.get("nhucau"))) S.need = p.get("nhucau");
  if (CHANNELS[p.get("kenh")]) S.ch = p.get("kenh");
  if (ALL_INS.includes(p.get("hang"))) S.ins = p.get("hang");
}

/* ============ DRAWER ============ */
function docTile(d){
  const t = DOC_TYPES[d[0]];
  return `<div class="doc"><a href="${d[1]}" target="_blank" rel="noopener"><span class="di">${ic(t.icon)}</span><span style="min-width:0"><b>${esc(docLabel(d))}</b><small>${host(d[1])}</small></span></a><button class="cp" data-copy="${d[1]}" aria-label="Sao chép link ${esc(docLabel(d))}">${ic("copy")}</button></div>`;
}
function rowLink(t,u,icon){ return `<a class="row" href="${u}" target="_blank" rel="noopener">${ic(icon)}<span>${esc(t)}</span>${ic("ext")}</a>`; }
let openedProduct = null;
function openProduct(id){
  const p = PRODUCTS.find(x => x.id === id); if(!p) return;
  const n = needOf(p.need);
  openedProduct = p;
  Track.send("product", p.id, p.name, CHANNELS[p.ch]);
  $("drawer").innerHTML = `
    <div class="d-cover" style="background:var(--t-${p.need});color:var(--i-${p.need})">
      <button class="d-close" id="dClose">${ic("arrow")}Quay lại danh sách</button>
      ${ic(n.icon,"i big")}
      <span class="mono" style="position:relative;font-size:12px;font-weight:700">${CHANNELS[p.ch]} · ${n.short.toUpperCase()}</span>
      ${(p.insurers||[]).length ? `<div class="tags">${insTags(p)}</div>` : ""}
      <h2 id="dTitle" style="color:var(--ink)">${esc(p.name)}</h2>
      <span class="ins">${esc(p.ins)}</span>
      <p class="lead">${esc(p.desc)}</p>
    </div>
    <div class="d-body">
      <div class="d-sec wide"><h3>TÀI LIỆU SẢN PHẨM · ${p.docs.length}</h3><div class="docs">${p.docs.map(docTile).join("")}</div></div>
    </div>`;
  $("drawer").hidden = false; $("drawer").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("dClose").focus();
  try{ history.replaceState(null,"","#p-"+id); }catch(e){}
}
function closeDrawer(){
  $("drawer").hidden = true; $("scrim").hidden = true;
  document.body.style.overflow = "";
  syncHash();
}

/* ============ POPUP VINH DANH ============ */
/* File Drive / Docs / Slides xem trước được ngay trong popup; Google Sites, Gapowork chặn nhúng nên chỉ có nút mở */
function previewUrl(u){
  let m = u.match(/^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = u.match(/^https:\/\/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
  if (m) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
  return "";
}
/* Nội dung chi tiết: mỗi đoạn xuống dòng là một đoạn văn, **chữ** thành chữ đậm */
const richText = s => String(s).split(/\n+/).map(x => x.trim()).filter(Boolean)
  .map(x => `<p>${esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</p>`).join("");
/* Link riêng của từng thẻ vinh danh: …/#vd-<họ-tên>-<ngày>, mở thẳng popup.
   Tạo từ Họ tên + Ngày cập nhật nên không đổi khi thêm/xóa dòng trong Sheet. */
const honorSlug = m => "vd-" + norm([m.name || m.t, m.date].filter(Boolean).join(" ")).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const honorLink = m => location.origin + location.pathname + "#" + honorSlug(m);
let honorReturn = null, openedHonor = null;
function openHonor(id){
  const m = MEDIA.find(x => x.id === id); if (!m) return;
  const pv = m.u ? previewUrl(m.u) : "";
  openedHonor = m;
  Track.send("honor", honorSlug(m), m.name || m.t, m.badge);
  try{ history.replaceState(null,"","#"+honorSlug(m)); }catch(e){}
  honorReturn = document.activeElement;
  $("honorModal").innerHTML = `<div class="hm-box">
    <button class="hm-x" id="hmClose" aria-label="Đóng">${ic("x")}</button>
    ${honorTop(m, "h2", "hmTitle")}
    <div class="hm-body">
      ${m.t ? `<h4>${esc(m.t)}</h4>` : ""}
      ${m.d ? `<p class="hm-lead">${esc(m.d)}</p>` : ""}
      ${m.c ? `<div class="hm-text">${richText(m.c)}</div>` : ""}
      ${pv ? `<iframe class="hm-frame" src="${pv}" title="Bài chia sẻ của ${esc(m.name)}" loading="lazy" allow="autoplay"></iframe>` : ""}
      <div class="hm-acts">
        ${m.u ? `<a class="hm-btn${pv ? " ghost" : ""}" href="${m.u}" target="_blank" rel="noopener">${pv ? "Mở toàn màn hình" : m.sec==="bonus" ? "Xem chính sách chi tiết" : "Xem bài chia sẻ gốc"} ${ic("ext")}</a>` : ""}
        <button class="hm-btn${m.u ? " ghost" : ""}" data-copy="${esc(honorLink(m))}" data-toast="Đã sao chép link vinh danh, dán vào Zalo để gửi đồng nghiệp">${ic("copy")}Sao chép link</button>
      </div>
    </div></div>`;
  $("honorModal").hidden = false; $("scrim").hidden = false;
  $("honorModal").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("hmClose").focus();
}
function closeHonor(){
  $("honorModal").hidden = true; $("honorModal").innerHTML = ""; $("scrim").hidden = true;
  document.body.style.overflow = "";
  openedHonor = null;
  syncHash();
  honorReturn?.focus?.();
}

/* ============ EVENTS ============ */
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
/* Thống kê: ghi lượt bấm tài liệu, sao chép link, mở thẻ truyền thông, đổi mục xem (xem thongke.js) */
const viewName = v => v === "products" ? "Sản phẩm" : v === "media" ? "Tổng quan truyền thông" : (SECTIONS.find(s => "sec-"+s.id === v) || {}).label || v;
document.addEventListener("click", e => {
  const doc = e.target.closest("#drawer .doc a, #drawer .doc .cp");
  if (doc && openedProduct){
    const d = openedProduct.docs.find(x => x[1] === (doc.getAttribute("href") || doc.dataset.copy));
    if (d) Track.send("doc", openedProduct.id+" · "+d[0], openedProduct.name+" · "+docLabel(d), doc.classList.contains("cp") ? "Sao chép link" : "Mở");
    return;
  }
  const m = e.target.closest("a.m, a.hc");
  if (m && !(m.dataset.honor && !e.ctrlKey && !e.metaKey && !e.shiftKey)){
    const item = MEDIA.find(x => x.u === m.getAttribute("href"));
    if (item) Track.send("media", (SECTIONS.find(s => s.id === item.sec) || {}).label || item.sec, item.name || item.t, "Mở");
    return;
  }
  const hl = e.target.closest("#honorModal a.hm-btn, #honorModal [data-copy]");
  if (hl){ if (openedHonor) Track.send("media", "Vinh danh & case study", openedHonor.name || openedHonor.t, hl.dataset.copy ? "Sao chép link vinh danh" : "Mở bài gốc"); return; }
  const v = e.target.closest("[data-view], #bonus");
  if (v) setTimeout(() => Track.send("view", viewName(S.view), S.view === "products" ? (S.need === "all" ? "Tất cả" : needOf(S.need).short) : ""), 0);
}, true);
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v){ e.preventDefault(); S.view = v.dataset.view; if (v.dataset.need) S.need = v.dataset.need; render(); $("side").classList.remove("open"); window.scrollTo({top:0}); return; }
  const nd = e.target.closest(".need[data-need]");
  if (nd){ S.need = nd.dataset.need; render(); return; }
  const ins = e.target.closest("[data-ins]");
  if (ins){ S.ins = ins.dataset.ins; render(); return; }
  const ch = e.target.closest("[data-ch]");
  if (ch){ S.ch = ch.dataset.ch; render(); return; }
  const hn = e.target.closest("[data-honor]");
  if (hn && !e.ctrlKey && !e.metaKey && !e.shiftKey){ e.preventDefault(); openHonor(hn.dataset.honor); return; }
  if (!$("honorModal").hidden && (e.target.id==="honorModal" || e.target.closest("#hmClose"))){ closeHonor(); return; }
  if (e.target.id==="scrim" && !$("honorModal").hidden){ closeHonor(); return; }
  const op = e.target.closest("[data-open]");
  if (op){ openProduct(op.dataset.open); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp){ const u = cp.dataset.copy;
    navigator.clipboard?.writeText(u).then(()=>toast(cp.dataset.toast || "Đã sao chép link, dán vào Zalo để gửi khách"), ()=>toast(u)) ?? toast(u); return; }
  if (e.target.id==="scrim" || e.target.closest("#dClose")){ closeDrawer(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key!=="Escape") return;
  if (!$("honorModal").hidden) closeHonor();
  else if (!$("drawer").hidden) closeDrawer();
});
$("q").addEventListener("input", e => {
  S.q = e.target.value; renderContent();
  Track.search(S.q, S.view === "products" ? filteredProducts().length + mediaMatches().length : mediaMatches(S.view.startsWith("sec-") ? S.view.slice(4) : "").length);
});
/* Menu trái: điện thoại thì trượt ra/vào, máy tính thì thu gọn/mở lại (nhớ lựa chọn) */
const isDesktop = () => matchMedia("(min-width: 901px)").matches;
function setCollapsed(on){
  document.querySelector(".app").classList.toggle("collapsed", on);
  $("menuBtn").setAttribute("aria-label", on ? "Mở menu" : "Mở danh mục");
  $("menuBtn").title = on ? "Mở menu" : "";
  try{ localStorage.setItem("nnx-side", on ? "thu" : "mo"); }catch(e){}
}
$("menuBtn").addEventListener("click", () => isDesktop() ? setCollapsed(false) : $("side").classList.toggle("open"));
$("sideClose").addEventListener("click", () => isDesktop() ? setCollapsed(true) : $("side").classList.remove("open"));
(() => {
  let saved = null; try{ saved = localStorage.getItem("nnx-side"); }catch(e){}
  /* Nhúng trong Google Site (khung hẹp) thì mặc định thu gọn */
  const embedded = window.self !== window.top;
  if (saved ? saved === "thu" : embedded) setCollapsed(true);
})();
$("bonus").addEventListener("click", () => { S.view="sec-bonus"; S.q=""; $("q").value=""; render(); $("side").classList.remove("open"); });
$("themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("nnx-theme", r.dataset.theme); }catch(e){}
});
try{ const t = localStorage.getItem("nnx-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}

/* Tải nội dung từ Google Sheet (xem sheet.js), lỗi thì dùng dữ liệu trong data.js */
function start(){
  ALL_INS = [...new Set(PRODUCTS.flatMap(p => p.insurers||[]))];
  $("ticker").innerHTML = [...TICKER,...TICKER].map(t=>`<span>${t}</span><span>◆</span>`).join("");
  const hash = decodeURIComponent(location.hash);
  Track.visit();
  if (hash.startsWith("#p-")){
    const p = PRODUCTS.find(x => x.id === hash.slice(3));
    if (p) S.need = p.need;  /* nền phía sau là nhóm nhu cầu của sản phẩm */
    render(); openProduct(hash.slice(3));
  } else if (hash.startsWith("#vd-")){
    const m = MEDIA.find(x => (x.sec === "case" || x.sec === "bonus") && honorSlug(x) === hash.slice(1));
    S.view = "sec-case"; render();
    if (m) openHonor(m.id);
  } else {
    readHash(hash); render();
  }
}
$("content").innerHTML = `<div class="empty">Đang tải nội dung…</div>`;
loadSheet().catch(e => ({used:{}, problems:["Lỗi khi đọc Sheet: "+e.message]})).then(report => { start(); showSheetReport(report); });
</script>
