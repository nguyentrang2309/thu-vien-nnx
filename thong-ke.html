<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thống kê truy cập · Thư viện NNX</title>
<style>
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"SVN-Gilroy";src:url("fonts/svn-gilroy-800.woff2") format("woff2");font-weight:800;font-display:swap}
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --ink:#12231A; --muted:#5A6B60; --line:#D9E3DA; --track:#EAF0EA;
  --brand:#0A8A3E; --brand-soft:#E2F1E6; --lime:#D4EC3A; --up:#0A7A37; --down:#B4361F;
  --shadow:0 1px 2px rgba(18,35,26,.06),0 6px 20px rgba(18,35,26,.06);
  --f:"SVN-Gilroy",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#141E18; --ink:#E5EEE7; --muted:#92A497; --line:#25332A; --track:#1C2922;
  --brand:#2DBE66; --brand-soft:#16301F; --lime:#C6E03A; --up:#4CD383; --down:#F08A70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#141E18; --ink:#E5EEE7; --muted:#92A497; --line:#25332A; --track:#1C2922;
  --brand:#2DBE66; --brand-soft:#16301F; --lime:#C6E03A; --up:#4CD383; --down:#F08A70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:20px}
header .t{flex:1;min-width:220px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.back{font-size:13px;font-weight:600;text-decoration:none}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi,.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .d b{font-weight:700}.kpi .d .up{color:var(--up)}.kpi .d .down{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{padding:16px 18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0;font-size:16px;font-weight:700}
.card .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}
.card .h span{font-size:12px;color:var(--muted)}
/* Biểu đồ cột theo ngày */
.chart{position:relative;height:220px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.yax{position:relative;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid var(--line)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.bars .c{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bars .c i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:1px}
.bars .c:hover i,.bars .c.on i{opacity:.75}
.xax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:6px 0 0 40px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{display:block;font-size:14px}
/* Danh sách xếp hạng */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .n{font-weight:700;font-variant-numeric:tabular-nums}
.rank .bar{grid-column:1/-1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.hours{display:flex;align-items:flex-end;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.hours i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:1px}
.hx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.err{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--down);border-radius:8px;padding:16px}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.kpi{padding:12px}.kpi .v{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t"><h1>Thống kê truy cập</h1><div class="sub" id="sub">Thư viện Bảo hiểm Ngôi Nhà Xanh</div></div>
    <div class="seg" id="seg" role="group" aria-label="Khoảng thời gian">
      <button data-d="7">7 ngày</button><button data-d="30">30 ngày</button><button data-d="90">90 ngày</button>
    </div>
    <a class="back" href="./">← Về thư viện</a>
  </header>
  <div id="note"></div>
  <div id="main"><div class="empty">Đang tải số liệu…</div></div>
</div>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("vi-VN");
const demo = /[?&]demo\b/.test(location.search);
try{ const t = localStorage.getItem("nnx-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}

let days = 30;
try{ days = Number(localStorage.getItem("nnx-stats-days")) || 30; }catch(e){}

/* Số liệu mẫu cho ?demo, cùng cấu trúc với Apps Script trả về */
function demoData(n){
  const r = s => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };
  const daily = [], now = Date.now();
  for (let i = n - 1; i >= 0; i--){
    const d = new Date(now - i * 864e5), wk = d.getDay() === 0 ? .35 : d.getDay() === 6 ? .6 : 1;
    const v = Math.round((40 + 30 * r(i + n)) * wk);
    daily.push({d: d.toISOString().slice(0, 10), visits: v, visitors: Math.round(v * .62)});
  }
  const sum = daily.reduce((a, x) => a + x.visits, 0), k = n / 30;
  const sc = arr => arr.map(([a, b]) => [a, Math.max(1, Math.round(b * k))]);
  return {ok:true, days:n, from:daily[0].d, to:daily[n-1].d, updated:"(số liệu mẫu)",
    totals:{visits:sum, visitors:Math.round(sum * .31), sessions:sum, products:Math.round(sum * 1.4), docs:Math.round(sum * .9), searches:Math.round(sum * .35)},
    previous:{visits:Math.round(sum * .86), visitors:Math.round(sum * .29), sessions:0, products:Math.round(sum * 1.2), docs:Math.round(sum * .95), searches:Math.round(sum * .3)},
    daily, hours:[0,0,0,0,0,1,3,9,22,30,26,18,10,14,25,28,24,17,9,6,4,2,1,0].map(x => Math.round(x * k * 2)),
    topProducts:sc([["TNDS xe máy",310],["Trợ cấp nằm viện",265],["Tai nạn cá nhân",190],["TNDS ô tô",160],["Chăm sóc sức khỏe",120],["Trợ cấp thu nhập 6 tháng",84],["MIC Care",51]]),
    topDocs:sc([["TNDS xe máy · Salekit bán hàng",180],["Trợ cấp nằm viện · Hướng dẫn cấp đơn",142],["TNDS ô tô · Biểu phí",110],["Tai nạn cá nhân · Quy tắc BH",76],["Chăm sóc sức khỏe · Salekit bán hàng",61]]),
    topDocTypes:sc([["Salekit bán hàng",340],["Hướng dẫn cấp đơn",260],["Biểu phí",150],["Quy tắc BH",120],["Đào tạo sản phẩm",90]]),
    topMedia:sc([["Tin mới · Chính sách thưởng 2026",120],["Vinh danh · Nguyễn Mạnh Linh",64],["Câu chuyện bồi thường · Chi trả 50 triệu cho khách KV3",40],["Kho content social · Bộ ảnh TNDS ô tô",33]]),
    topSearches:sc([["ô tô",44],["tnds",37],["quy tắc",25],["cấp đơn",19],["mic",12]]),
    noResult:sc([["sức khỏe trẻ em",6],["nhà ở",4],["du lịch",3]]),
    sources:sc([["Trực tiếp",620],["Nhúng trong Google Site",410],["zalo.me",150],["www.gapowork.vn",60]]),
    devices:sc([["Điện thoại",780],["Máy tính",460]]), views:[]};
}

async function load(){
  $("seg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.d) === days));
  const url = typeof STATS_URL === "string" ? STATS_URL.trim() : "";
  if (demo || !url){
    $("note").innerHTML = `<div class="note">${demo ? "Đang xem <b>số liệu mẫu</b>, không phải số liệu thật." : "Chưa kết nối thống kê. Dưới đây là <b>số liệu mẫu</b>."} Cách cài: xem mục <i>Thống kê truy cập</i> trong README.</div>`;
    return draw(demoData(days));
  }
  $("main").innerHTML = `<div class="empty">Đang tải số liệu…</div>`;
  try{
    const res = await fetch(`${url}?days=${days}`, {cache:"no-store"});
    const data = await res.json();
    if (!data.ok) throw new Error("Apps Script trả về lỗi.");
    draw(data);
  }catch(e){
    $("main").innerHTML = `<div class="err"><b>Không tải được số liệu.</b><br>Kiểm tra link <code>STATS_URL</code> trong data.js và Apps Script đã triển khai với quyền <i>Bất kỳ ai</i>. (${esc(e.message)})</div>`;
  }
}

function delta(cur, prev){
  if (!prev) return `<div class="d">Kỳ trước: chưa có số liệu</div>`;
  const p = Math.round((cur - prev) / prev * 100);
  const cls = p > 0 ? "up" : p < 0 ? "down" : "";
  return `<div class="d"><b class="${cls}">${p > 0 ? "▲ " : p < 0 ? "▼ " : ""}${Math.abs(p)}%</b> so với ${days} ngày trước đó</div>`;
}
function rank(list, empty){
  if (!list || !list.length) return `<div class="empty">${empty || "Chưa có số liệu."}</div>`;
  const max = list[0][1];
  return `<ol class="rank">${list.map(([k, v]) => `<li><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="n">${fmt(v)}</span><span class="bar"><i style="width:${Math.max(2, v / max * 100)}%"></i></span></li>`).join("")}</ol>`;
}
const card = (title, hint, body, wide) => `<section class="card${wide ? " wide" : ""}"><div class="h"><h2>${title}</h2>${hint ? `<span>${hint}</span>` : ""}</div>${body}</section>`;
const dmy = s => s.split("-").reverse().slice(0, 2).join("/");

/* Trục y: làm tròn lên số đẹp, chia 4 khoảng */
function niceMax(v){
  if (v <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

function draw(D){
  const T = D.totals, P = D.previous || {};
  $("sub").textContent = `Từ ${dmy(D.from)} đến ${dmy(D.to)}/${D.to.slice(0, 4)} · cập nhật ${D.updated}`;
  const kpi = (l, v, pv) => `<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div>${delta(v, pv)}</div>`;
  const top = Math.max(...D.daily.map(x => x.visits), 0), ymax = niceMax(top);
  const ticks = [0, .25, .5, .75, 1];
  const step = Math.ceil(D.daily.length / 6);
  const chart = `<div class="chart">
      <div class="yax">${ticks.map(t => `<span style="bottom:${t * 100}%">${fmt(Math.round(ymax * t))}</span>`).join("")}</div>
      <div class="plot" id="plot">${ticks.slice(1).map(t => `<div class="gl" style="bottom:${t * 100}%"></div>`).join("")}
        <div class="bars">${D.daily.map((x, i) => `<div class="c" data-i="${i}"><i style="height:${x.visits / ymax * 100}%"></i></div>`).join("")}</div>
      </div></div>
    <div class="xax">${D.daily.filter((x, i) => i % step === 0 || i === D.daily.length - 1).map(x => `<span>${dmy(x.d)}</span>`).join("")}</div>`;
  const hmax = Math.max(...D.hours, 1);
  const hours = `<div class="hours" aria-label="Lượt vào trang theo giờ">${D.hours.map((h, i) => `<i title="${i}h: ${fmt(h)} lượt" style="height:${h / hmax * 100}%"></i>`).join("")}</div><div class="hx"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>`;

  $("main").innerHTML = `
    <div class="kpis">
      ${kpi("Lượt vào trang", T.visits, P.visits)}
      ${kpi("Người xem", T.visitors, P.visitors)}
      ${kpi("Lượt mở sản phẩm", T.products, P.products)}
      ${kpi("Lượt bấm tài liệu", T.docs, P.docs)}
    </div>
    <div class="grid">
      ${card("Lượt vào trang theo ngày", "Chạm hoặc di chuột lên cột để xem số", chart, true)}
      ${card("Sản phẩm được mở nhiều nhất", "lượt mở", rank(D.topProducts))}
      ${card("Tài liệu được bấm nhiều nhất", "gồm mở và sao chép link", rank(D.topDocs))}
      ${card("Loại tài liệu được dùng nhiều", "lượt bấm", rank(D.topDocTypes))}
      ${card("Truyền thông được xem nhiều", "lượt mở", rank(D.topMedia))}
      ${card("Từ khóa tìm kiếm", "lượt tìm", rank(D.topSearches))}
      ${card("Tìm mà không thấy kết quả", "gợi ý nội dung nên bổ sung", rank(D.noResult, "Không có lượt tìm nào bị trống. Tốt!"))}
      ${card("Vào từ đâu", "lượt vào trang", rank(D.sources))}
      ${card("Thiết bị", "lượt vào trang", rank(D.devices))}
      ${card("Giờ truy cập trong ngày", "giờ Việt Nam", hours, true)}
    </div>`;

  /* Tooltip cột theo ngày */
  const plot = $("plot"), tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true; plot.appendChild(tip);
  const show = c => {
    plot.querySelectorAll(".c.on").forEach(x => x.classList.remove("on"));
    const x = D.daily[c.dataset.i]; c.classList.add("on");
    tip.innerHTML = `${dmy(x.d)}<b>${fmt(x.visits)} lượt vào</b>${fmt(x.visitors)} người xem`;
    const r = c.getBoundingClientRect(), pr = plot.getBoundingClientRect();
    const left = Math.min(Math.max(r.left - pr.left + r.width / 2, 60), pr.width - 60);
    tip.style.left = left + "px";
    tip.style.top = Math.max(c.firstChild.offsetTop - 8, 40) + "px";
    tip.hidden = false;
  };
  plot.querySelectorAll(".c").forEach(c => { c.addEventListener("mouseenter", () => show(c)); c.addEventListener("click", () => show(c)); });
  plot.addEventListener("mouseleave", () => { tip.hidden = true; plot.querySelectorAll(".c.on").forEach(x => x.classList.remove("on")); });
}

$("seg").addEventListener("click", e => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  days = Number(b.dataset.d);
  try{ localStorage.setItem("nnx-stats-days", days); }catch(e){}
  load();
});
load();
</script>
</body>
</html>
